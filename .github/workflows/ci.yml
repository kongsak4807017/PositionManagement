name: CHRO HR1 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./ci_chro.db
      JWT_SECRET: ci-only-secret-not-for-production-1234567890
      ALLOWED_ORIGINS: http://localhost:8000
      HROPS_STORAGE_DIR: ./ci_hrops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile production backend
        run: python -m py_compile production.py
      - name: Initialize schema and test XLSX to database UPSERT
        run: |
          python production.py init-reference
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import hashlib
          from openpyxl import Workbook
          import production

          db = production.SessionLocal()
          assert db.query(production.Province).count() == 8
          assert db.query(production.OrganizationalUnit).count() >= 15

          user = production.User(
              username="ci-admin",
              password_hash=production.hash_password("Strong-CI-Password-123"),
              full_name="CI Admin",
              role=production.UserRole.REGION_ADMIN,
              is_active=True,
          )
          db.add(user)
          db.commit()

          def make_file(path, current_level):
              wb = Workbook()
              summary = wb.active
              summary.title = "สรุป"
              ws = wb.create_sheet("เขต 1")
              ws.append(["คำเตือน"])
              ws.append(["ข้อมูลทดสอบ"])
              ws.append(["ข้อมูล ณ วันที่"])
              ws.append(list(range(1, 21)))
              # Row 5: human-readable labels (not used by importer)
              ws.append([
                  "ประเภทบุคลากร","position_id","เลขที่ตำแหน่ง","รหัสจังหวัด",
                  "จังหวัด","รหัสหน่วยงาน","ชื่อหน่วยงาน","ประเภทหน่วยงาน",
                  "ชื่อตำแหน่ง","ประเภทตำแหน่ง","ระดับเริ่มต้น","ระดับสิ้นสุด",
                  "ระดับปัจจุบัน","สถานะตำแหน่ง","สถานะการดำรงตำแหน่ง",
                  "วันเกษียณ","วันที่ว่าง","สาเหตุว่าง","",""
              ])
              # Row 6: verified J18 technical headers
              ws.append([
                  "ประเภทบุคลากร","position_id","position_code","pos_province_code",
                  "pos_province_name","pos_ou_path3_code","pos_rev_name","pos_ประเภทส่วนราชการ",
                  "line_position_name","position_type_name","from_level_name","to_level_name",
                  "pay_position_level_name","สถานะตำแหน่ง","employment_rev_status",
                  "retirement_date","empty_date","empty_movement_name","",""
              ])
              ws.append([
                  "1.ข้าราชการ","11111111-1111-1111-1111-111111111111","99999","57",
                  "เชียงราย","U5701","รพศ.เชียงรายประชานุเคราะห์","รพศ.",
                  "นักวิชาการสาธารณสุข","วิชาการ","ปฏิบัติการ","ชำนาญการพิเศษ",
                  current_level,"1.มีคนครอง","ดำรงตำแหน่ง",
                  None,None,None,None,None
              ])
              wb.save(path)

          def run_import(path, month):
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              run = production.HropsImportRun(
                  baseline_month=month,
                  original_filename=Path(path).name,
                  stored_path=str(path),
                  sha256=digest,
                  file_size_bytes=Path(path).stat().st_size,
                  status="RECEIVED",
                  uploaded_by_user_id=user.user_id,
              )
              db.add(run)
              db.commit()
              run = db.get(production.HropsImportRun, run.import_id)
              summary = production.process_hrops_workbook(db, run)
              db.commit()
              return summary

          make_file("ci_hrops_1.xlsx", "ชำนาญการ")
          s1 = run_import("ci_hrops_1.xlsx", date(2026, 9, 1))
          assert s1["inserted"] == 1
          p = db.query(production.Position).filter(production.Position.hrops_position_no == "99999").one()
          assert p.position_level == "ชำนาญการ"

          make_file("ci_hrops_2.xlsx", "ชำนาญการพิเศษ")
          s2 = run_import("ci_hrops_2.xlsx", date(2026, 10, 1))
          assert s2["updated"] == 1
          db.refresh(p)
          assert p.position_level == "ชำนาญการพิเศษ"
          assert db.query(production.HropsPositionSnapshot).count() == 2

          province_user = production.User(
              username="province-ci",
              password_hash=production.hash_password("Strong-CI-Password-456"),
              full_name="Province CI",
              role=production.UserRole.PROVINCE_ADMIN,
              province_code="57",
              is_active=True,
          )
          hospital_user = production.User(
              username="hospital-ci",
              password_hash=production.hash_password("Strong-CI-Password-789"),
              full_name="Hospital CI",
              role=production.UserRole.HOSPITAL_HR,
              unit_id="U5701",
              is_active=True,
          )
          executive = production.User(
              username="executive-ci",
              password_hash=production.hash_password("Strong-CI-Password-987"),
              full_name="Executive CI",
              role=production.UserRole.REGION_EXECUTIVE,
              is_active=True,
          )
          db.add_all([province_user, hospital_user, executive])
          db.commit()

          assert production.scoped_position_query(db, province_user).count() == 1
          assert production.scoped_position_query(db, hospital_user).count() == 1
          production.assert_unit_scope(db, province_user, "U5701", write=True)
          production.assert_unit_scope(db, hospital_user, "U5701", write=True)
          try:
              production.assert_unit_scope(db, executive, "U5701", write=True)
              raise AssertionError("Executive write access must be denied")
          except production.HTTPException as exc:
              assert exc.status_code == 403

          db.close()
          assert production.healthz()["status"] == "ok"
          print("XLSX -> DB insert/update smoke test: PASS")
          PY

  static-preview-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/v2-data.js
          node --check assets/v2-app.js
          node --check production_ui/app.js
      - name: Verify Pages entrypoint and v2 assets
        run: |
          test -f index.html
          test -f assets/v2-data.js
          test -f assets/v2-app.js
          grep -q "assets/v2-data.js" index.html
          grep -q "assets/v2-app.js" index.html
          grep -q "CHRO_V2_SEED" assets/v2-data.js
          grep -q "localStorage" assets/v2-app.js
          grep -q "position_level" assets/v2-data.js
          grep -q "fRetirementApproved" assets/v2-app.js
          test -f production_ui/index.html
          test -f production_ui/styles.css
          test -f production_ui/app.js
          grep -q "Upload จ.18 / HROPS" production_ui/index.html
          grep -q "REGION_ADMIN" production_ui/index.html
          grep -q "PROVINCE_ADMIN" production_ui/index.html
          grep -q "HOSPITAL_HR" production_ui/index.html
          grep -q "/api/dashboard/summary" production_ui/app.js

  deployment-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production deployment assets
        run: |
          test -f production.py
          test -f deploy/docker-compose.prod.yml
          test -f deploy/nginx.conf
          test -f docs/DATA_FLOW.md
          test -f docs/DEPLOYMENT_MOPH.md
          test -f .env.example
          grep -q "mermaid" docs/DATA_FLOW.md
          grep -q "postgres:16-alpine" deploy/docker-compose.prod.yml
          grep -q "JWT_SECRET" .env.example
