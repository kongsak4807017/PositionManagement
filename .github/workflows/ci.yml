name: CHRO HR1 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./ci_chro.db
      JWT_SECRET: ci-only-secret-not-for-production-1234567890
      ALLOWED_ORIGINS: http://localhost:8000
      HROPS_STORAGE_DIR: ./ci_hrops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile production backend
        run: python -m py_compile production.py
      - name: Initialize schema and reference data
        run: |
          python production.py init-reference
          python - <<'PY'
          import production
          db=production.SessionLocal()
          assert db.query(production.Province).count() == 8
          assert db.query(production.OrganizationalUnit).count() >= 15
          db.close()
          assert production.healthz()["status"] == "ok"
          print("Production backend smoke test: PASS")
          PY

  static-preview-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/v2-data.js
          node --check assets/v2-app.js
      - name: Verify Pages entrypoint and v2 assets
        run: |
          test -f index.html
          test -f assets/v2-data.js
          test -f assets/v2-app.js
          grep -q "assets/v2-data.js" index.html
          grep -q "assets/v2-app.js" index.html
          grep -q "CHRO_V2_SEED" assets/v2-data.js
          grep -q "localStorage" assets/v2-app.js
          grep -q "position_level" assets/v2-data.js
          grep -q "fRetirementApproved" assets/v2-app.js

  deployment-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production deployment assets
        run: |
          test -f production.py
          test -f deploy/docker-compose.prod.yml
          test -f deploy/nginx.conf
          test -f docs/DATA_FLOW.md
          test -f docs/DEPLOYMENT_MOPH.md
          test -f .env.example
          grep -q "mermaid" docs/DATA_FLOW.md
          grep -q "postgres:16-alpine" deploy/docker-compose.prod.yml
          grep -q "JWT_SECRET" .env.example
