name: CHRO HR1 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python init_db.py
      - run: python -m py_compile main.py database.py init_db.py
      - name: Smoke test API functions
        run: |
          python - <<'PY'
          import main
          assert main.healthz()["status"] == "ok"
          overview = main.get_overview()
          assert overview["summary"]["total_positions"] == 22
          positions = main.list_positions()["positions"]
          assert len(positions) == 22
          assert "position_level" in positions[0]
          assert "retirement_use_approved" in positions[0]
          retirement = [p for p in positions if p["vacant_reason"] == "เกษียณอายุราชการ"]
          assert len(retirement) == 5
          print("CHRO HR1 backend smoke test: PASS")
          PY

  static-preview-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/v2-data.js
          node --check assets/v2-app.js
      - name: Verify Pages entrypoint and v2 assets
        run: |
          test -f index.html
          test -f assets/v2-data.js
          test -f assets/v2-app.js
          grep -q "assets/v2-data.js" index.html
          grep -q "assets/v2-app.js" index.html
          grep -q "CHRO_V2_SEED" assets/v2-data.js
          grep -q "localStorage" assets/v2-app.js
          grep -q "renderGovernance" assets/v2-app.js
          grep -q "openTimeline" assets/v2-app.js
          grep -q "position_level" assets/v2-data.js
          grep -q "fPositionLevel" assets/v2-app.js
          grep -q "fRetirementApproved" assets/v2-app.js
          grep -q "retirement_approval_doc_no" assets/v2-data.js
