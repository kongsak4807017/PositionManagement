services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chro_hr1}
      POSTGRES_USER: ${POSTGRES_USER:-chro_hr1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - chro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chro_hr1} -d ${POSTGRES_DB:-chro_hr1}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chro_internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chro_hr1}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chro_hr1}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      HROPS_STORAGE_DIR: /data/hrops
      MAX_HROPS_UPLOAD_MB: ${MAX_HROPS_UPLOAD_MB:-100}
    volumes:
      - chro_hrops:/data/hrops
    depends_on:
      db:
        condition: service_healthy
    networks: [chro_internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-/opt/chro-hr1/tls}:/etc/nginx/tls:ro
    depends_on: [app]
    networks: [chro_internal]

networks:
  chro_internal:
    driver: bridge

volumes:
  chro_pgdata:
  chro_hrops:
